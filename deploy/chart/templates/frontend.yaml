# The SPA: nginx serving the Vite build (frontend/Dockerfile). Its own /api +
# /events proxy (BFF_ADDR) serves it standalone; here the HTTPRoute sends the
# BFF's paths to the bff directly and everything else to this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          {{- include "cloudbreak.image" (list $ "frontend") | nindent 10 }}
          ports:
            - containerPort: 80
          env:
            - name: BFF_ADDR
              value: http://bff:8080
          livenessProbe:
            httpGet: { path: /, port: 80 }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
