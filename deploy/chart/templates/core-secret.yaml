# W4-H-5 (#134): the BFF↔core hop's bearer secret. The core refuses every
# Connect call that does not present `Bearer <CORE_SHARED_SECRET>`, so the bff
# pod and the core pod read the SAME value from this one Secret. Minted once
# (`randAlphaNum 48`) and KEPT across upgrades via `lookup` — a re-mint on
# every `helm upgrade` would roll the two pods onto different values until
# both restarted. (`helm template` has no cluster to look up, so it always
# renders a fresh value.)
{{- $name := "cloudbreak-core-secret" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
{{- if and $existing $existing.data (hasKey $existing.data "CORE_SHARED_SECRET") }}
  CORE_SHARED_SECRET: {{ index $existing.data "CORE_SHARED_SECRET" }}
{{- else }}
  CORE_SHARED_SECRET: {{ randAlphaNum 48 | b64enc }}
{{- end }}
